[workspace]
resolver = "2"
members = [
    "common",
    "registry",
    "price-guard",
    "pledge-vault",
    "credit-line",
    "exit-desk",
    "repo-dvp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0-rc.2"
ballast-common = { path = "common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
